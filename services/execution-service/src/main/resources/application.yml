server:
  port: 8082
spring:
  application:
    name: execution-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:ledgerbull_execution}
    username: ${DB_USER:ledgerbull}
    password: ${DB_PASSWORD:ledgerbull}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate      # schema managed by Flyway in later sub-phases
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    redis:
      enabled: false
matching-engine:
  host: ${MATCHING_ENGINE_HOST:localhost}
  port: ${MATCHING_ENGINE_PORT:50051}

# Phase 5 risk limits (pre-trade checks enforced in RiskEngine).
ledgerbull:
  risk:
    max-order-quantity: 1000
    max-net-position-per-symbol: 10000
    max-notional-usd: 1000000
    fat-finger-band-percent: 10
    max-realized-loss-usd: 50000
    fail-closed: true
    position-service-base-url: ${POSITION_SERVICE_BASE_URL:http://localhost:8083}
